<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Administrasi Warga RW</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--p:#1e3a8a;--p2:#2563eb;--bg:#f3f4f6;--b:#e5e7eb;--t:#111827;--m:#6b7280;--ok:#16a34a;--w:#d97706;--er:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t)}
button,input,select,textarea{font:inherit}h2{margin:0;font-size:20px}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer;font-weight:600}.btn.g{background:#e5e7eb;color:var(--t)}
.sm{min-height:36px;padding:0 10px;border:1px solid var(--b);background:#fff;border-radius:8px;cursor:pointer;margin:2px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
#side{position:fixed;inset:0 auto 0 0;width:260px;background:var(--p);color:#fff;overflow:auto;z-index:30;transition:transform .25s}
#side h1{font-size:16px;margin:0;padding:18px 16px;border-bottom:1px solid #fff2}
#side a{display:block;padding:12px 16px;color:#fff;text-decoration:none;cursor:pointer;min-height:44px}#side a:hover,#side a.on{background:#fff2}
#side .sub{display:none;background:#0003}#side .sub.open{display:block}#side .sub a{padding-left:40px;font-size:14px}
main{margin-left:260px}#ham{display:none;background:0;border:0;font-size:24px;cursor:pointer;min-width:44px;min-height:44px}
.top{position:sticky;top:0;background:#fff;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:0 1px 3px #0002;z-index:20}.top b{flex:1}
.top .ic{background:0;border:0;font-size:20px;min-width:44px;min-height:44px;cursor:pointer;position:relative}.dot{position:absolute;top:4px;right:2px;background:var(--er);color:#fff;font-size:11px;border-radius:9px;padding:0 5px}
#ov{display:none;position:fixed;inset:0;background:#0006;z-index:25}#ov.open{display:block}
#page{padding:16px;max-width:1200px}.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px #0001}.st b{display:block;font-size:24px;color:var(--p)}.st span{color:var(--m);font-size:13px}
.pb{height:12px;background:var(--b);border-radius:6px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--p2)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;background:#e5e7eb}.ok{background:#dcfce7;color:#166534}.wn{background:#fef3c7;color:#92400e}.er{background:#fee2e2;color:#991b1b}.bl{background:#dbeafe;color:#1e40af}
.tw{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--b);font-size:14px}th{background:#f9fafb;color:var(--m)}
.srch{margin:8px 0}.flt{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.flt select{width:auto;min-width:110px}.empty{padding:32px;text-align:center;color:var(--m);background:#fff;border-radius:14px}
.pager{display:flex;justify-content:space-between;align-items:center;margin:12px 0;color:var(--m);font-size:13px}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#modal.open{display:flex}
.mb{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px}.mb h3{margin:0 0 12px}.fg{display:block;margin-bottom:10px}.fg span{display:block;font-size:13px;color:var(--m);margin-bottom:2px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.mact .btn{flex:1}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;width:90%;max-width:400px}
.toast{background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 4px 12px #0004}.toast.err{background:var(--er)}.toast.ok{background:var(--ok)}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--p2),#93c5fd,var(--p2));background-size:200%;animation:mv 1s linear infinite;z-index:90}@keyframes mv{to{background-position:200%}}
.sk{height:90px;border-radius:14px;margin-bottom:12px;background:linear-gradient(90deg,#e5e7eb,#f3f4f6,#e5e7eb);background-size:200%;animation:mv 1.2s linear infinite}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}#login .card{width:100%;max-width:360px}
[hidden]{display:none!important}canvas{max-height:260px}
@media(max-width:900px){#side{transform:translateX(-100%)}#side.open{transform:none}main{margin-left:0}#ham{display:inline-flex;align-items:center;justify-content:center}}
@media(max-width:768px){.tw{background:0;box-shadow:none}table,tbody,tr,td{display:block;width:100%}thead{display:none}
tr{background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;margin-bottom:10px;padding:6px 0}td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 14px;text-align:right}
td::before{content:attr(data-label);color:var(--m);text-align:left;flex-shrink:0}td.ac{justify-content:flex-end;flex-wrap:wrap}td.ac::before{content:none}.mb{max-height:96vh}}
@media print{#side,.top,.acts,.srch,.flt,#ham{display:none!important}main{margin:0}}
</style></head><body>
<div id="bar" hidden></div>
<div id="login"><form class="card" id="lf"><h2 style="color:var(--p);margin-bottom:4px">SISTEM ADMINISTRASI WARGA RW</h2><p style="color:var(--m);margin-top:0">Silakan login</p>
<label class="fg"><span>Username</span><input id="lu" autocomplete="username" autocapitalize="none" required></label>
<label class="fg"><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
<button class="btn" style="width:100%">Masuk</button></form></div>
<div id="app" hidden><aside id="side"></aside><div id="ov"></div>
<main><header class="top"><button id="ham" aria-label="Menu">☰</button><b>SISTEM WARGA</b><button class="ic" id="bell" title="Notifikasi">🔔<span class="dot" id="dot" hidden></span></button><button class="ic" id="usr" title="Pengaturan">👤</button></header><section id="page"></section></main></div>
<div id="modal"><div class="mb" id="mb"></div></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const BLN=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const S={token:null,user:null,lk:{rumah:[],warga:[],rt:[],iuran:{}},charts:[],nav:0,page:'dashboard'};
const ADM=['SUPERADMIN','ADMIN_RW','ADMIN_RT'],RDR=ADM.concat(['BENDAHARA','PETUGAS']),FIN=['SUPERADMIN','ADMIN_RW','BENDAHARA'],KR=ADM.concat(['BENDAHARA']);
const isAdm=()=>ADM.includes(S.user.role);
/* ---------- UI dasar ---------- */
let lc=0;function showLoading(){lc++;$('#bar').hidden=false}function hideLoading(){lc=Math.max(0,lc-1);if(!lc)$('#bar').hidden=true}
function showToast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3500)}
function showError(e){let m=(e&&e.message)||'';if(!m||/Exception|TypeError|ScriptError|undefined|at \w+/.test(m)||m.length>160)m='Terjadi kesalahan. Silakan coba lagi.';if(m.indexOf('Sesi')===0){doLogout(true);}showToast('❌ '+m,'err')}
function modal(title,html){$('#mb').innerHTML='<h3>'+esc(title)+'</h3>'+html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
const API_URL='https://script.google.com/macros/s/AKfycbw_Eju928I31ni931s8rrl88uhMPOS6eewoXtrLsAfEbh_OfkDPrTT1oNrrvz9OU5Nb7g/exec'; // hanya dipakai jika file ini di GitHub Pages
function call(fn,args){
if(window.google&&google.script&&google.script.run)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.error);return r.data})}
function api(fn,...a){return new Promise((ok,no)=>{showLoading();call(fn,[S.token].concat(a)).then(r=>{hideLoading();ok(r)}).catch(e=>{hideLoading();showError(e);no(e)})})}
const skel=()=>'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const badge=(s,c)=>{const m={AKTIF:'ok',LUNAS:'ok',SELESAI:'ok',DISETUJUI:'ok',NORMAL:'ok',BELUM:'wn',WARNING:'wn',DIVERIFIKASI:'bl',DIAJUKAN:'wn',DITOLAK:'er',EXPIRED:'er',KELUAR:'er',MENINGGAL:'er',TERISI:'ok',KOSONG:'wn'};return '<span class="badge '+(c||m[s]||'')+'">'+esc(s)+'</span>'};
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok({name:f.name,mime:f.type,data:String(r.result).split(',')[1]});r.onerror=no;r.readAsDataURL(f)})}
const link=u=>u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">Buka</a>':'-';
/* ---------- Form & tabel generik ---------- */
const refLabel=(src,id)=>{const i=(S.lk[src]||[]).find(x=>x.id===id);return i?i.label:''};
function openForm(o){const f=o.fields,v=o.v||{};
const h=f.map(x=>{const val=v[x.k]!==undefined?v[x.k]:(x.d||'');const id='f_'+x.k;let i;
if(x.t==='select')i='<select id="'+id+'">'+x.o.map(op=>{const a=Array.isArray(op)?op[0]:op,b=Array.isArray(op)?op[1]:op;return '<option value="'+esc(a)+'"'+(String(a)===String(val)?' selected':'')+'>'+esc(b)+'</option>'}).join('')+'</select>';
else if(x.t==='textarea')i='<textarea id="'+id+'" rows="3">'+esc(val)+'</textarea>';
else if(x.t==='ref')i='<input id="'+id+'" list="dl_'+x.k+'" value="'+esc(refLabel(x.src,val))+'" placeholder="Ketik untuk mencari…" autocomplete="off"><datalist id="dl_'+x.k+'">'+(S.lk[x.src]||[]).map(a=>'<option value="'+esc(a.label)+'">').join('')+'</datalist>';
else if(x.t==='file')i='<input id="'+id+'" type="file" accept="image/*,application/pdf">';
else i='<input id="'+id+'" type="'+(x.t||'text')+'" value="'+esc(val)+'"'+(x.m?' maxlength="'+x.m+'"':'')+(x.inp?' inputmode="'+x.inp+'"':'')+'>';
return '<label class="fg"><span>'+esc(x.l)+(x.r?' *':'')+'</span>'+i+'</label>'}).join('');
modal(o.title,(o.pre||'')+'<form id="mf">'+h+'<div class="mact"><button type="button" class="btn g" onclick="closeModal()">Batal</button><button class="btn">'+esc(o.btn||'Simpan')+'</button></div></form>');
$('#mf').onsubmit=async e=>{e.preventDefault();const out={};
for(const x of f){const el=$('#f_'+x.k);
if(x.t==='file'){const fl=el.files[0];if(fl){if(fl.size>4*1024*1024){showToast('Ukuran file maksimal 4 MB','err');return}out._file=await readFile(fl)}else if(x.r){showToast(x.l+' wajib diunggah','err');return}continue}
let val=el.value.trim();
if(x.t==='ref'){const it=(S.lk[x.src]||[]).find(a=>a.label===val);val=it?it.id:'';if(x.r&&!val){showToast('Pilih '+x.l+' dari daftar','err');return}}
if(x.r&&!val){showToast(x.l+' wajib diisi','err');return}out[x.k]=val}
try{await o.ok(out);closeModal()}catch(err){}}}
function table(cols,rows,acts){if(!rows.length)return '<div class="empty">Belum ada data</div>';
return '<div class="tw"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c.l)+'</th>').join('')+(acts?'<th></th>':'')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+cols.map(c=>'<td data-label="'+esc(c.l)+'">'+(c.f?c.f(r):esc(r[c.k]))+'</td>').join('')+(acts?'<td class="ac">'+acts.map((a,j)=>(!a.s||a.s(r))?'<button class="sm" data-i="'+i+'" data-a="'+j+'">'+a.l+'</button>':'').join('')+'</td>':'')+'</tr>').join('')+'</tbody></table></div>'}
function listView(c){const my=S.nav,st={q:'',page:1};let rows=[],tm;
$('#page').innerHTML='<div class="ph"><h2>'+esc(c.title)+'</h2><div class="acts">'+(c.tools||'')+(c.add?'<button class="btn" id="add">+ '+esc(c.add)+'</button>':'')+'</div></div>'+(c.filters?'<div class="flt">'+c.filters+'</div>':'')+'<div class="srch"><input id="q" type="search" placeholder="🔎 '+esc(c.ph||'Cari…')+'"></div><div id="lv">'+skel()+'</div>';
const load=async()=>{const base=c.base?c.base():{};let r;try{r=await api(c.fn,Object.assign({},base,{q:st.q,page:st.page,size:10}))}catch(e){if(my===S.nav)$('#lv').innerHTML='<div class="empty">Gagal memuat data.</div>';return}
if(my!==S.nav)return;rows=r.rows;$('#lv').innerHTML=(c.head?c.head(r):'')+table(c.cols,rows,c.acts)+(r.pages>1||r.total>10?'<div class="pager"><button class="sm" data-pg="-1"'+(r.page<=1?' disabled':'')+'>‹ Sebelumnya</button><span>Hal '+r.page+'/'+r.pages+' · '+r.total+' data</span><button class="sm" data-pg="1"'+(r.page>=r.pages?' disabled':'')+'>Berikutnya ›</button></div>':'<div class="pager"><span>'+r.total+' data</span></div>')};
$('#q').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{st.q=e.target.value;st.page=1;load()},400)};
document.querySelectorAll('.flt select').forEach(s=>s.onchange=()=>{st.page=1;load()});
$('#lv').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pg){st.page+=Number(b.dataset.pg);load()}else if(b.dataset.a!==undefined)c.acts[b.dataset.a].f(rows[b.dataset.i],load)};
if(c.add)$('#add').onclick=()=>c.addf(load);window.reload=load;load()}
const selOpts=(a,sel)=>a.map(x=>'<option value="'+x[0]+'"'+(String(x[0])===String(sel)?' selected':'')+'>'+x[1]+'</option>').join('');
const gv=id=>{const e=$('#'+id);return e?e.value:''};
/* ---------- Definisi form ---------- */
const RTOPT=()=>(S.lk.rt.length?S.lk.rt:['01','02','03']);
const wargaF=()=>[{k:'nik',l:'NIK',r:1,m:16,inp:'numeric'},{k:'no_kk',l:'No KK',r:1,m:16,inp:'numeric'},{k:'nama',l:'Nama',r:1},{k:'jenis_kelamin',l:'Jenis Kelamin',t:'select',o:[['L','Laki-laki'],['P','Perempuan']]},{k:'tempat_lahir',l:'Tempat Lahir'},{k:'tanggal_lahir',l:'Tanggal Lahir',t:'date'},
{k:'status_keluarga',l:'Status Keluarga',t:'select',o:['KEPALA_KELUARGA','ISTRI','SUAMI','ANAK','ORANG_TUA','LAINNYA'],d:'KEPALA_KELUARGA'},{k:'id_rumah',l:'Rumah',t:'ref',src:'rumah',r:1},{k:'no_hp',l:'No HP',t:'tel',inp:'tel'},{k:'status_warga',l:'Status Warga',t:'select',o:['AKTIF','KELUAR','MENINGGAL']},
{k:'tanggal_masuk',l:'Tanggal Masuk',t:'date'},{k:'tanggal_keluar',l:'Tanggal Keluar',t:'date'},{k:'keterangan',l:'Keterangan',t:'textarea'},{k:'foto',l:'Foto',t:'file'}];
const rumahF=()=>[{k:'nomor_rumah',l:'Nomor Rumah',r:1},{k:'blok',l:'Blok'},{k:'rt',l:'RT',t:'select',o:RTOPT()},{k:'rw',l:'RW',d:'01',m:2},{k:'status_rumah',l:'Status Rumah',t:'select',o:['MILIK','KONTRAK','SEWA','KOSONG']},{k:'nama_pemilik',l:'Nama Pemilik'},{k:'catatan',l:'Catatan',t:'textarea'},{k:'foto_rumah',l:'Foto Rumah',t:'file'}];
const kkF=()=>[{k:'no_kk',l:'No KK',r:1,m:16,inp:'numeric'},{k:'nama_kepala_keluarga',l:'Kepala Keluarga',r:1},{k:'id_rumah',l:'Rumah',t:'ref',src:'rumah',r:1},{k:'alamat',l:'Alamat (opsional)'}];
const kontrakF=()=>[{k:'id_rumah',l:'Rumah',t:'ref',src:'rumah',r:1},{k:'id_pemilik',l:'Pemilik (warga)',t:'ref',src:'warga'},{k:'id_penghuni',l:'Penghuni (warga)',t:'ref',src:'warga'},{k:'jenis',l:'Jenis',t:'select',o:['KONTRAK','SEWA']},{k:'tanggal_mulai',l:'Tanggal Mulai',t:'date',r:1},{k:'tanggal_selesai',l:'Tanggal Selesai',t:'date',r:1},{k:'no_hp_pemilik',l:'No HP Pemilik',t:'tel'},{k:'no_hp_penghuni',l:'No HP Penghuni',t:'tel'},{k:'status',l:'Status',t:'select',o:['AKTIF','SELESAI']},{k:'keterangan',l:'Keterangan',t:'textarea'},{k:'file_perjanjian',l:'File Perjanjian',t:'file'}];
const SURAT={DOMISILI:{n:'Surat Domisili',f:[{k:'id_warga',l:'Warga',t:'ref',src:'warga',r:1},{k:'keperluan',l:'Keperluan',r:1}]},
PENGANTAR:{n:'Surat Pengantar',f:[{k:'id_warga',l:'Warga',t:'ref',src:'warga',r:1},{k:'jenis_keperluan',l:'Jenis Keperluan',r:1},{k:'keterangan',l:'Keterangan',t:'textarea'}]},
KEMATIAN:{n:'Surat Kematian',f:[{k:'id_warga',l:'Nama Almarhum',t:'ref',src:'warga',r:1},{k:'tanggal_meninggal',l:'Tanggal Meninggal',t:'date',r:1},{k:'jam_meninggal',l:'Jam Meninggal',t:'time'},{k:'tempat_meninggal',l:'Tempat Meninggal'},{k:'pelapor',l:'Pelapor',r:1},{k:'hubungan_pelapor',l:'Hubungan Pelapor'},{k:'keterangan',l:'Keterangan',t:'textarea'}]},
MASUK:{n:'Warga Masuk',f:[{k:'nama',l:'Nama',r:1},{k:'nik',l:'NIK',r:1,m:16,inp:'numeric'},{k:'no_kk',l:'No KK',m:16,inp:'numeric'},{k:'alamat_asal',l:'Alamat Asal'},{k:'id_rumah',l:'Rumah Tujuan',t:'ref',src:'rumah',r:1},{k:'tanggal_masuk',l:'Tanggal Masuk',t:'date',r:1},{k:'status',l:'Status',t:'select',o:['TETAP','KONTRAK','SEWA']},{k:'pemilik_rumah',l:'Pemilik Rumah'},{k:'no_hp',l:'No HP',t:'tel'}]},
KELUAR:{n:'Warga Keluar',f:[{k:'id_warga',l:'Warga',t:'ref',src:'warga',r:1},{k:'tanggal_keluar',l:'Tanggal Keluar',t:'date',r:1},{k:'alamat_tujuan',l:'Alamat Tujuan'},{k:'alasan',l:'Alasan'}]},
KONTRAK:{n:'Kontrak/Sewa',f:[{k:'id_rumah',l:'Rumah',t:'ref',src:'rumah',r:1},{k:'pemilik',l:'Pemilik',r:1},{k:'penghuni',l:'Penghuni',r:1},{k:'jenis',l:'Jenis',t:'select',o:['KONTRAK','SEWA']},{k:'tanggal_mulai',l:'Tanggal Mulai',t:'date',r:1},{k:'tanggal_selesai',l:'Tanggal Selesai',t:'date',r:1},{k:'no_hp',l:'No HP',t:'tel'}]}};
async function refreshLk(){try{S.lk=await api('getLookup')}catch(e){}}
function ajukanSurat(j,done){const d=SURAT[j];openForm({title:'Ajukan '+d.n,fields:d.f.concat([{k:'catatan',l:'Catatan (opsional)'}]),btn:'Ajukan',ok:async v=>{const p={jenis:j,id_warga:v.id_warga,id_rumah:v.id_rumah,keperluan:v.keperluan||'',data:v};await api('saveSurat',p);showToast('Surat diajukan','ok');done&&done()}})}
function pilihJenis(done){modal('Pilih Jenis Surat','<div style="display:grid;gap:8px">'+Object.keys(SURAT).map(k=>'<button class="btn g" data-j="'+k+'">'+SURAT[k].n+'</button>').join('')+'</div>');$('#mb').onclick=e=>{const b=e.target.closest('[data-j]');if(b){closeModal();ajukanSurat(b.dataset.j,done)}}}
/* ---------- Halaman ---------- */
const PAGES={};

PAGES.dashboard=async()=>{const my=S.nav,d=await api('getDashboard');if(my!==S.nav)return;

if(['SUPERADMIN','ADMIN_RW'].includes(u.role))h+='<div class="grid" style="margin-top:12px"><button class="btn g" id="gu">👥 Kelola Pengguna</button><button class="btn g" id="gl">🧾 Log Aktivitas</button></div>';
$('#page').innerHTML=h;$('#lo').onclick=()=>doLogout();
$('#cp').onclick=()=>openForm({title:'Ganti Password',fields:[{k:'a',l:'Password Lama',t:'password',r:1},{k:'b',l:'Password Baru (min 8)',t:'password',r:1}],ok:async o=>{await api('changePassword',o.a,o.b);showToast('Password diganti','ok')}});
if($('#gu'))$('#gu').onclick=()=>showPage('users');if($('#gl'))$('#gl').onclick=()=>showPage('log')};
const userF=e=>[{k:'username',l:'Username',r:1},{k:'nama',l:'Nama',r:1},{k:'role',l:'Role',t:'select',o:['ADMIN_RW','ADMIN_RT','BENDAHARA','PETUGAS','WARGA'].concat(S.user.role==='SUPERADMIN'?['SUPERADMIN']:[])},{k:'rt',l:'RT (untuk ADMIN_RT)',m:2},{k:'id_rumah',l:'Rumah (wajib untuk role WARGA)',t:'ref',src:'rumah'},{k:'status',l:'Status',t:'select',o:['AKTIF','NONAKTIF']},{k:'password',l:e?'Password baru (kosongkan jika tidak diubah)':'Password (min 8)',t:'password',r:!e}];
PAGES.users=()=>listView({title:'Pengguna',fn:'getUsers',ph:'Cari username / nama / role',add:'Pengguna',addf:l=>openForm({title:'Tambah Pengguna',fields:userF(0),ok:async o=>{await api('saveUser',o);showToast('Pengguna dibuat','ok');l()}}),
cols:[{l:'Username',f:r=>'<b>'+esc(r.username)+'</b>'},{l:'Nama',k:'nama'},{l:'Role',k:'role'},{l:'RT',k:'rt'},{l:'Status',f:r=>badge(r.status)}],
acts:[{l:'Edit',f:(r,l)=>openForm({title:'Edit Pengguna',fields:userF(1).filter(f=>f.k!=='username'),v:r,ok:async o=>{await api('updateUser',r.id_user,o);showToast('Tersimpan','ok');l()}})}]});
PAGES.log=()=>listView({title:'Log Aktivitas',fn:'getLogAktivitas',ph:'Cari user / aksi / modul',cols:[{l:'Waktu',k:'timestamp'},{l:'User',k:'user'},{l:'Role',k:'role'},{l:'Aksi',f:r=>badge(r.action,'bl')},{l:'Modul',k:'module'},{l:'Keterangan',k:'description'}]});
/* ---------- Navigasi ---------- */
const WS=[['Semua Warga','warga','semua'],['Kepala Keluarga','warga','kk'],['Warga Tetap','warga','tetap'],['Warga Kontrak/Sewa','warga','kontrak'],['Warga Masuk','warga','masuk'],['Warga Keluar','warga','keluar']];
const NAV=[{i:'🏠',t:'Dashboard',p:'dashboard'},{i:'💳',t:'Iuran Saya',p:'iuransaya',r:['WARGA']},{i:'👨‍👩‍👧',t:'Data Warga',r:RDR,s:WS},{i:'🏘️',t:'Data Rumah',p:'rumah',r:RDR},{i:'📇',t:'Data KK',p:'kk',r:RDR},{i:'📝',t:'Kontrak/Sewa',p:'kontrak',r:RDR},{i:'🧾',t:'Konfirmasi Bayar',p:'konfirmasi',r:KR},
{i:'💰',t:'Iuran',r:RDR,s:[['Tagihan','iuran','tagihan'],['Pembayaran','iuran','pembayaran'],['Tunggakan','iuran','tunggakan'],['Rekap Iuran','iuran','rekap']]},
{i:'💵',t:'Keuangan',r:FIN,s:[['Kas RT','keuangan','kas_rt'],['Kas RW','keuangan','kas_rw'],['Dana Sosial','keuangan','dana_sosial'],['Pemasukan','keuangan','pemasukan'],['Pengeluaran','keuangan','pengeluaran']]},
{i:'📄',t:'Surat Menyurat',s:[['Pengajuan Surat','surat',''],['Surat Domisili','surat','DOMISILI'],['Surat Pengantar','surat','PENGANTAR'],['Surat Kematian','surat','KEMATIAN'],['Warga Masuk','surat','MASUK'],['Warga Keluar','surat','KELUAR'],['Kontrak/Sewa','surat','KONTRAK']]},
{i:'📁',t:'Dokumen',p:'dokumen',r:RDR},{i:'📊',t:'Laporan',p:'laporan',r:RDR},{i:'⚙️',t:'Pengaturan',p:'pengaturan'}];
function buildNav(){const ok=n=>!n.r||n.r.includes(S.user.role);
$('#side').innerHTML='<h1>🏘️ ADMINISTRASI WARGA RW</h1>'+NAV.filter(ok).map((n,x)=>n.s?'<a data-x="'+x+'">'+n.i+' '+n.t+' ▾</a><div class="sub" id="sub'+x+'">'+n.s.map(s=>'<a data-p="'+s[1]+'" data-a="'+s[2]+'">'+s[0]+'</a>').join('')+'</div>':'<a data-p="'+n.p+'">'+n.i+' '+n.t+'</a>').join('');
$('#side').onclick=e=>{const a=e.target.closest('a');if(!a)return;if(a.dataset.x!==undefined)$('#sub'+a.dataset.x).classList.toggle('open');else showPage(a.dataset.p,a.dataset.a)}}
function closeNav(){$('#side').classList.remove('open');$('#ov').classList.remove('open')}
$('#ham').onclick=()=>{$('#side').classList.add('open');$('#ov').classList.add('open')};$('#ov').onclick=closeNav;
function showPage(p,a){S.nav++;S.page=p;S.charts.forEach(c=>c.destroy());S.charts=[];closeNav();
document.querySelectorAll('#side a').forEach(x=>x.classList.toggle('on',x.dataset.p===p&&(x.dataset.a===undefined||x.dataset.a===(a||''))));
$('#page').innerHTML=skel();scrollTo(0,0);try{const r=(PAGES[p]||PAGES.dashboard)(a);if(r&&r.catch)r.catch(()=>{$('#page').innerHTML='<div class="empty">Gagal memuat halaman. Silakan coba lagi.</div>'})}catch(e){showError(e)}}
$('#bell').onclick=()=>{const d=S.notif||{};const s=d.surat||{};modal('Notifikasi','<p>📄 Pengajuan surat baru: <b>'+(s.baru||0)+'</b></p><p>📝 Kontrak berakhir ≤30 hari: <b>'+(d.kontrakWarning||0)+'</b></p><p>💳 Pembayaran menunggu verifikasi: <b>'+(d.konfirmasi||0)+'</b></p><div class="mact"><button class="btn" onclick="closeModal();showPage(\'surat\')">Lihat Surat</button></div>')};
$('#usr').onclick=()=>showPage('pengaturan');
/* ---------- Login ---------- */
function enter(){$('#login').hidden=true;$('#app').hidden=false;buildNav();refreshLk().then(()=>showPage('dashboard'))}
function doLogout(silent){if(!silent&&S.token)call('logout',[S.token]).catch(()=>{});S.token=null;try{sessionStorage.removeItem('tk')}catch(e){}$('#app').hidden=true;$('#login').hidden=false;$('#lp').value=''}
$('#lf').onsubmit=e=>{e.preventDefault();showLoading();call('login',[$('#lu').value,$('#lp').value]).then(r=>{hideLoading();S.token=r.token;S.user=r.user;try{sessionStorage.setItem('tk',r.token)}catch(x){}enter()}).catch(er=>{hideLoading();showError(er)})};
(function(){let t=null;try{t=sessionStorage.getItem('tk')}catch(e){}if(!t)return;S.token=t;showLoading();call('me',[t]).then(u=>{hideLoading();S.user=u;enter()}).catch(()=>{hideLoading();doLogout(true)})})();
</script></body></html>
