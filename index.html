<style>

.tw{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--b);font-size:14px}th{background:#f9fafb;color:var(--m)}

#bar{position:fixed;top:0;left:0;right:0;height:4px;background:#bfdbfe;z-index:90}#bar i{display:block;height:100%;width:0;background:var(--p2);transition:width .25s}#chip{position:fixed;top:62px;right:12px;background:#111827;color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;z-index:91}@keyframes mv{to{background-position:200%}}

td::before{content:attr(data-label);color:var(--m);text-align:left;flex-shrink:0}td.ac{justify-content:flex-end;flex-wrap:wrap}td.ac::before{content:none}.mb{max-height:96vh}}

input,select,textarea{font-size:16px}input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:var(--p2)}
.fg.bad input,.fg.bad select,.fg.bad textarea{border-color:var(--er);background:#fef2f2}

@media(max-width:480px){.ph{flex-direction:column;align-items:stretch}.acts{width:100%}.acts .btn{flex:1}.flt select{flex:1;min-width:0}}

.chat{display:flex;flex-direction:column;height:calc(100vh - 120px);height:calc(100dvh - 120px);background:#fff;border-radius:14px;box-shadow:0 1px 4px #0001;overflow:hidden}
.ch{padding:12px 16px;border-bottom:1px solid var(--b);font-weight:700}.ch small{color:var(--m);font-weight:400;margin-left:6px}

.cn{font-size:12px;font-weight:700;color:var(--p2);margin-bottom:2px}.ct{font-size:11px;color:var(--m);text-align:right;margin-top:2px}.ct a{color:var(--er);cursor:pointer}
.ci{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:4px}.cf{display:inline-block;background:#f3f4f6;border-radius:8px;padding:8px 10px;margin-bottom:4px;text-decoration:none;color:var(--t)}
.cd{text-align:center;font-size:12px;color:var(--m);margin:10px 0}
#cp{padding:6px 12px;background:#f9fafb;border-top:1px solid var(--b);display:flex;align-items:center;gap:8px;font-size:13px}#cp img{height:44px;border-radius:6px}#cp button{margin-left:auto}
.cc{display:flex;gap:8px;padding:10px;border-top:1px solid var(--b);align-items:flex-end}.cc textarea{min-height:44px;max-height:120px;resize:none;flex:1}.ic2{background:#f3f4f6;border:0;border-radius:10px;min-width:44px;min-height:44px;font-size:20px;cursor:pointer}
@media(max-width:900px){.chat{height:calc(100vh - 100px);height:calc(100dvh - 100px)}}
.paper{background:#fff;border:1px solid #cbd5e1;box-shadow:0 1px 6px #0002;padding:18px;font-family:'Times New Roman',serif;font-size:14px;max-height:52vh;overflow:auto;border-radius:6px;margin:10px 0}.paper hr{border:0;border-top:2px solid #111;margin:8px 0}.pvn{font-size:12px;color:var(--m)}
.xt{width:100%;border-collapse:collapse;font-size:13px}.xt td{padding:4px 6px;border-bottom:1px solid var(--b)}.xr{max-height:38vh;overflow:auto;margin:8px 0}
</style></head><body>
<div id="bar" hidden><i id="barfill"></i></div><div id="chip" hidden></div>
<div id="prog" hidden><div class="pc"><div id="ptxt">Memproses…</div><div class="pbar"><i id="pfill"></i></div><div id="ppct">0%</div></div></div>
<div id="login"><form class="card" id="lf"><h2 style="color:var(--p);margin-bottom:4px">SISTEM ADMINISTRASI WARGA RW</h2><p style="color:var(--m);margin-top:0">Silakan login</p>
<label class="fg"><span>Username</span><input id="lu" autocomplete="username" autocapitalize="none" required></label>

<main><header class="top"><button id="ham" aria-label="Menu">☰</button><b>SISTEM WARGA</b><button class="ic" id="bell" title="Notifikasi">🔔<span class="dot" id="dot" hidden></span></button><button class="ic" id="usr" title="Pengaturan">👤</button></header><section id="page"></section></main></div>
<div id="modal"><div class="mb" id="mb"></div></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const BLN=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const S={token:null,user:null,lk:{rumah:[],warga:[],rt:[],iuran:{}},charts:[],nav:0,page:'dashboard'};
const ADM=['SUPERADMIN','ADMIN_RW','ADMIN_RT'],RDR=ADM.concat(['BENDAHARA','PETUGAS']),FIN=['SUPERADMIN','ADMIN_RW','BENDAHARA'],KR=ADM.concat(['BENDAHARA']);
const isAdm=()=>ADM.includes(S.user.role);
/* ---------- UI dasar ---------- */
const P={tasks:{},n:0,
start(l,b){const id=++P.n,k={l:l,p:2,b:b,real:false,s:Date.now()};k.t=setInterval(()=>{if(!k.real&&k.p<92)k.p+=(92-k.p)*0.08;P.draw()},250);P.tasks[id]=k;P.draw();return id},
set(id,p,l){const k=P.tasks[id];if(k){k.p=Math.max(k.p,Math.min(p,99));if(l)k.l=l;P.draw()}},
up(id,f){const k=P.tasks[id];if(!k)return;if(f<1){k.real=true;k.l='Mengunggah file…';k.p=Math.max(k.p,f*50)}else{k.real=false;k.l='Memproses di server…';k.p=Math.max(k.p,50)}P.draw()},
end(id){const k=P.tasks[id];if(!k)return;clearInterval(k.t);k.p=100;k.l='Selesai';P.draw();setTimeout(()=>{delete P.tasks[id];P.draw()},400)},
draw(){const ks=Object.keys(P.tasks).map(i=>P.tasks[i]),bl=ks.filter(k=>k.b&&Date.now()-k.s>200),nb=ks.filter(k=>!k.b);
if(bl.length){const k=bl[bl.length-1];$('#prog').hidden=false;$('#ptxt').textContent=k.l;$('#pfill').style.width=k.p+'%';$('#ppct').textContent=Math.round(k.p)+'%'}else $('#prog').hidden=true;
if(nb.length){const p=Math.min.apply(null,nb.map(k=>k.p));$('#bar').hidden=false;$('#barfill').style.width=p+'%';$('#chip').hidden=false;$('#chip').textContent=nb[0].l+' '+Math.round(p)+'%'}else{$('#bar').hidden=true;$('#chip').hidden=true}}};
const LS=[];function showLoading(){LS.push(P.start('Memuat…',false))}function hideLoading(){const i=LS.pop();if(i)P.end(i)}
function showToast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3500)}
function showError(e){let m=(e&&e.message)||'';if(!m||/Exception|TypeError|ScriptError|undefined|at \w+/.test(m)||m.length>160)m='Terjadi kesalahan. Silakan coba lagi.';if(m.indexOf('Sesi')===0){doLogout(true);}showToast('❌ '+m,'err')}
function modal(title,html){$('#mb').innerHTML='<div class="mh"><h3>'+esc(title)+'</h3><button class="x" type="button" onclick="closeModal()" aria-label="Tutup">✕</button></div><div class="mbody">'+html+'</div>';$('#modal').classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){$('#modal').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
const API_URL='https://script.google.com/macros/s/AKfycbw_Eju928I31ni931s8rrl88uhMPOS6eewoXtrLsAfEbh_OfkDPrTT1oNrrvz9OU5Nb7g/exec'; // hanya dipakai jika file ini di GitHub Pages
function call(fn,args,onUp){
if(window.google&&google.script&&google.script.run)return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST',API_URL);x.setRequestHeader('Content-Type','text/plain;charset=utf-8');
x.onload=()=>{try{const r=JSON.parse(x.responseText);r.ok?ok(r.data):no(new Error(r.error))}catch(e){no(new Error('Terjadi kesalahan. Silakan coba lagi.'))}};
x.onerror=()=>no(new Error('Koneksi gagal. Periksa internet Anda.'));x.send(JSON.stringify({fn:fn,args:args}))})}
const LBL={saveWarga:'Menyimpan data warga',updateWarga:'Menyimpan perubahan',deleteWarga:'Menghapus data',saveRumah:'Menyimpan data rumah',updateRumah:'Menyimpan perubahan',saveKK:'Menyimpan data KK',saveKontrakSewa:'Menyimpan kontrak',updateKontrakSewa:'Menyimpan perubahan',generateTagihanBulanan:'Membuat tagihan bulanan',savePembayaran:'Mencatat pembayaran',ajukanPembayaran:'Mengirim bukti pembayaran',prosesKonfirmasi:'Memproses konfirmasi',savePengeluaran:'Mencatat pengeluaran',saveSurat:'Mengajukan surat',updateStatusSurat:'Memperbarui status surat',generateSuratPDF:'Membuat PDF surat',previewSurat:'Menyiapkan pratinjau',saveDokumen:'Mengunggah dokumen',deleteDokumen:'Menghapus dokumen',saveUser:'Menyimpan pengguna',updateUser:'Menyimpan pengguna',changePassword:'Mengganti password',getLaporan:'Menyusun laporan',getDashboard:'Memuat dashboard',getLookup:'Menyiapkan data'};
function api(fn,...a){const up=a.some(x=>x&&x._file),block=!/^get/.test(fn),id=P.start(up?'Mengunggah file…':(LBL[fn]||(block?'Memproses…':'Memuat data…')),block);
return call(fn,[S.token].concat(a),up?f=>P.up(id,f):null).then(r=>{P.end(id);return r}).catch(e=>{P.end(id);showError(e);throw e})}
const skel=()=>'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const badge=(s,c)=>{const m={AKTIF:'ok',LUNAS:'ok',SELESAI:'ok',DISETUJUI:'ok',NORMAL:'ok',BELUM:'wn',WARNING:'wn',DIVERIFIKASI:'bl',DIAJUKAN:'wn',BARU:'wn',DIPROSES:'bl',DITOLAK:'er',EXPIRED:'er',KELUAR:'er',MENINGGAL:'er',TERISI:'ok',KOSONG:'wn'};return '<span class="badge '+(c||m[s]||'')+'">'+esc(s)+'</span>'};
function readFile(f){return new Promise((ok,no)=>{const id=P.start('Menyiapkan file…',true);P.tasks[id].real=true;const r=new FileReader();r.onprogress=e=>{if(e.lengthComputable)P.set(id,e.loaded/e.total*100)};r.onload=()=>{P.end(id);ok({name:f.name,mime:f.type,data:String(r.result).split(',')[1]})};r.onerror=()=>{P.end(id);no(new Error('Gagal membaca file.'))};r.readAsDataURL(f)})}
const link=u=>u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">Buka</a>':'-';
/* ---------- Form & tabel generik ---------- */
const refLabel=(src,id)=>{const i=(S.lk[src]||[]).find(x=>x.id===id);return i?i.label:''};
function openForm(o){const f=o.fields,v=o.v||{};
const h=f.map(x=>{const val=v[x.k]!==undefined?v[x.k]:(x.d||'');const id='f_'+x.k;let i;
if(x.t==='select')i='<select id="'+id+'">'+x.o.map(op=>{const a=Array.isArray(op)?op[0]:op,b=Array.isArray(op)?op[1]:op;return '<option value="'+esc(a)+'"'+(String(a)===String(val)?' selected':'')+'>'+esc(b)+'</option>'}).join('')+'</select>';
else if(x.t==='textarea')i='<textarea id="'+id+'" rows="3">'+esc(val)+'</textarea>';
else if(x.t==='ref')i='<input id="'+id+'" list="dl_'+x.k+'" value="'+esc(refLabel(x.src,val))+'" placeholder="Ketik untuk mencari…" autocomplete="off"><datalist id="dl_'+x.k+'">'+(S.lk[x.src]||[]).map(a=>'<option value="'+esc(a.label)+'">').join('')+'</datalist>';
else if(x.t==='file')i='<input id="'+id+'" type="file" accept="image/*,application/pdf">';
else i='<input id="'+id+'" type="'+(x.t||'text')+'" value="'+esc(val)+'"'+(x.m?' maxlength="'+x.m+'"':'')+(x.inp?' inputmode="'+x.inp+'"':'')+'>';
return '<label class="fg'+((x.t==='textarea'||x.t==='file'||x.t==='ref'||x.w)?' wide':'')+'"><span>'+esc(x.l)+(x.r?' <b class="rq">*</b>':'')+'</span>'+i+'</label>'}).join('');
modal(o.title,(o.pre||'')+'<form id="mf" novalidate><div class="fgrid">'+h+'</div><div class="mact"><button type="button" class="btn g" onclick="closeModal()">Batal</button><button class="btn" id="msub">'+esc(o.btn||'Simpan')+'</button></div></form>');
document.querySelectorAll('#mf input,#mf select,#mf textarea').forEach(e=>e.addEventListener('input',()=>e.closest('.fg').classList.remove('bad')));
const bad=(x,m)=>{const el=$('#f_'+x.k);el.closest('.fg').classList.add('bad');el.focus();showToast(m,'err')};
$('#mf').onsubmit=async e=>{e.preventDefault();const btn=$('#msub'),out={};
for(const x of f){const el=$('#f_'+x.k);
if(x.t==='file'){const fl=el.files[0];if(fl){if(fl.size>4*1024*1024){bad(x,'Ukuran file maksimal 4 MB');return}out._file=await readFile(fl)}else if(x.r){bad(x,x.l+' wajib diunggah');return}continue}
let val=el.value.trim();
if(x.t==='ref'){const it=(S.lk[x.src]||[]).find(a=>a.label===val);val=it?it.id:'';if(x.r&&!val){bad(x,'Pilih '+x.l+' dari daftar');return}}
if(x.r&&!val){bad(x,x.l+' wajib diisi');return}out[x.k]=val}

function chatMsgHtml(m){const mine=chatMine(m);let b='';
if(m.x)b='<i style="opacity:.6">Pesan dihapus</i>';

function chatBadge(){const b=$('#cb');if(b){b.hidden=!S.cu;b.textContent=S.cu}}
function chatAppend(list,force){const box=$('#cm');if(!box)return;const near=box.scrollHeight-box.scrollTop-box.clientHeight<140;const em=box.querySelector('.empty');if(em)em.remove();let h='';
list.forEach(m=>{const d=String(m.t).slice(0,10);if(d!==S.cday){S.cday=d;h+='<div class="cd">'+esc(chatDay(d))+'</div>'}h+=chatMsgHtml(m)});

async function chatFetch(){if(!S.token||S.cbusy)return;S.cbusy=1;
try{const r=await apiQ('getChat',{lastId:S.cl}),first=!S.cinit;S.cinit=true;
const fresh=r.msgs.filter(m=>!S.cm.some(x=>x.id===m.id));fresh.forEach(m=>S.cm.push(m));if(S.cm.length>200)S.cm=S.cm.slice(-200);if(S.cm.length)S.cl=S.cm[S.cm.length-1].id;
let ch=false;(r.dels||[]).forEach(id=>{const m=S.cm.find(x=>x.id===id);if(m&&!m.x){m.x=1;m.p='';m.fu='';ch=true}});
if(S.page==='chat'){S.cu=0;if(ch)chatRenderAll();else if(fresh.length)chatAppend(fresh)}else if(!first)S.cu+=fresh.filter(m=>!chatMine(m)).length;
chatBadge()}catch(e){}finally{S.cbusy=0}}
function chatClearFile(){S.cfile=null;const f=$('#cfile');if(f)f.value='';const p=$('#cp');if(p){p.hidden=true;p.innerHTML=''}}

inp.value='';inp.style.height='';chatClearFile();await chatFetch();if(!S.cm.some(x=>x.id===m.id)){S.cm.push(m);chatAppend([m],true)}}
catch(e){if(!f)showError(e)}finally{btn.disabled=false;inp.focus()}}

const xlOk=()=>{if(!window.XLSX){showToast('Pustaka Excel belum termuat. Coba lagi sebentar.','err');return false}return true};

function lvx(j,c){c.tools=isAdm()?xlTools():'';listView(c);if(isAdm()){$('#xt').onclick=()=>xlTemplate(j);$('#xe').onclick=()=>xlExport(j);$('#xi').onclick=()=>xlImportUI(j)}}
function xlSheet(d,rows,rowsN){const ws=XLSX.utils.aoa_to_sheet([d.cols].concat(rows));const N=Math.max(rowsN,rows.length)+1;
d.cols.forEach((c,ci)=>{if(d.text.includes(c)||d.date.includes(c))for(let r=1;r<=N;r++){const a=XLSX.utils.encode_cell({r:r,c:ci});const cell=ws[a]||{t:'s',v:''};cell.t='s';cell.v=cell.v==null?'':String(cell.v);cell.z='@';ws[a]=cell}});
ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:N,c:d.cols.length-1}});ws['!cols']=d.cols.map(c=>({wch:Math.max(14,c.length+2)}));return ws}
async function xlTemplate(j){if(!xlOk())return;const d=XL[j];let rumah=[];
if(j!=='RUMAH'){try{rumah=(await api('exportData','RUMAH')).rows}catch(e){return}}
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,xlSheet(d,[],500),d.n);
XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['PETUNJUK PENGISIAN – '+d.n],['Isi data mulai baris 2 pada sheet "'+d.n+'". Jangan mengubah atau menghapus judul kolom (baris 1).'],['Kolom berformat Teks agar angka nol di depan tidak hilang. Jangan memakai tanda petik atau spasi tambahan.']].concat(d.help.map(x=>[x]))),'Petunjuk');
if(rumah.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['blok','nomor_rumah','rt','nama_pemilik','status_rumah']].concat(rumah.map(r=>[r.blok,r.nomor_rumah,r.rt,r.nama_pemilik,r.status_rumah]))),'Daftar Rumah');
XLSX.writeFile(wb,'template_'+j.toLowerCase()+'.xlsx');showToast('Template diunduh','ok')}
async function xlExport(j){if(!xlOk())return;const d=XL[j];let r;try{r=await api('exportData',j)}catch(e){return}
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,xlSheet(d,r.rows.map(x=>d.cols.map(c=>x[c]==null?'':String(x[c]))),0),d.n);
XLSX.writeFile(wb,'export_'+j.toLowerCase()+'_'+new Date().toISOString().slice(0,10)+'.xlsx');showToast(r.rows.length+' baris diekspor','ok')}
function xlParse(file,j){const d=XL[j];return new Promise((ok,no)=>{const bad=m=>no(Object.assign(new Error(m),{ui:1}));const fr=new FileReader();
fr.onerror=()=>bad('Gagal membaca file.');
fr.onload=e=>{try{const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];if(!ws)return bad('File kosong.');
const a=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});if(a.length<2)return bad('Tidak ada data. Isi mulai baris 2.');
const h=a[0].map(x=>String(x).trim().toLowerCase().replace(/\s+/g,'_'));const miss=d.cols.filter(c=>!h.includes(c));if(miss.length)return bad('Kolom tidak ditemukan: '+miss.join(', ')+'. Gunakan template.');
if(a.length-1>5000)return bad('Maksimal 5000 baris per file.');
const rows=[],errs=[],seen={};
for(let i=1;i<a.length;i++){const ro=a[i];if(ro.every(v=>String(v).trim()===''))continue;const o={_baris:i+1};
d.cols.forEach(c=>{let v=ro[h.indexOf(c)];if(typeof v==='number'){v=d.date.includes(c)&&v>20000?new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10):String(v)}o[c]=String(v==null?'':v).trim()});
const k=d.key(o);if(k&&seen[k]){errs.push({baris:o._baris,pesan:'Data ganda di file (sama dengan baris '+seen[k]+').'});continue}if(k)seen[k]=o._baris;rows.push(o)}
if(!rows.length&&!errs.length)return bad('Tidak ada baris data.');ok({rows:rows,errs:errs})}catch(x){bad('File tidak dapat dibaca. Pastikan berformat .xlsx.')}};fr.readAsArrayBuffer(file)})}
async function xlRun(j,rows,mode,dry,label){const id=P.start(label+'…',true);P.tasks[id].real=true;let tambah=0,ubah=0,errors=[];
try{for(let i=0;i<rows.length;i+=100){const b=rows.slice(i,i+100);const r=await call('importData',[S.token,j,b,{mode:mode,dry:dry}]);tambah+=r.tambah;ubah+=r.ubah;errors=errors.concat(r.errors);P.set(id,Math.min(99,(i+b.length)/rows.length*100),label+' '+Math.min(i+b.length,rows.length)+'/'+rows.length)}}
catch(e){P.end(id);showError(e);throw e}P.end(id);return{tambah:tambah,ubah:ubah,errors:errors}}
function xlErrCsv(errs){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',t=['baris,pesan'].concat(errs.map(e=>e.baris+','+q(e.pesan))).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='error_import.csv';a.click()}

$('#xgo').onclick=async()=>{const f=$('#xf').files[0];if(!f){showToast('Pilih file Excel dulu','err');return}const mode=$('#xm').value;
try{const p=await xlParse(f,j);const res=await xlRun(j,p.rows,mode,true,'Memeriksa data');xlReport(j,p.rows,p.errs.concat(res.errors),res,mode)}catch(e){if(e&&e.ui)showError(e)}}}
function xlReport(j,rows,errs,res,mode){const bad=new Set(errs.map(e=>e.baris)),valid=rows.filter(r=>!bad.has(r._baris));
modal('Hasil Pemeriksaan','<div class="card" style="margin-bottom:8px">Baris valid: <b>'+valid.length+'</b> (baru: '+res.tambah+', diperbarui: '+res.ubah+')<br>Baris bermasalah: <b style="color:var(--er)">'+errs.length+'</b></div>'+(errs.length?'<div class="xr"><table class="xt">'+errs.slice(0,100).map(e=>'<tr><td style="white-space:nowrap">Baris '+e.baris+'</td><td>'+esc(e.pesan)+'</td></tr>').join('')+'</table>'+(errs.length>100?'<div class="pvn">…dan '+(errs.length-100)+' lainnya (unduh daftar lengkap).</div>':'')+'</div>':'')+'<div class="pvn">Baris bermasalah dilewati. Perbaiki di Excel lalu import ulang bila perlu.</div><div class="mact"><button class="btn g" type="button" onclick="closeModal()">Tutup</button>'+(errs.length?'<button class="btn g" type="button" id="xerr">Unduh Error</button>':'')+(valid.length?'<button class="btn" type="button" id="xdo">Impor '+valid.length+' Baris</button>':'')+'</div>');
if(errs.length)$('#xerr').onclick=()=>xlErrCsv(errs);
if(valid.length)$('#xdo').onclick=async()=>{try{const out=await xlRun(j,valid,mode,false,'Mengimpor data');
modal('Impor Selesai','<div class="card">✅ Ditambah: <b>'+out.tambah+'</b><br>🔄 Diperbarui: <b>'+out.ubah+'</b><br>⚠️ Gagal: <b>'+out.errors.length+'</b></div><div class="mact"><button class="btn" type="button" onclick="closeModal()">Tutup</button></div>');
refreshLk();if(window.reload)window.reload()}catch(e){}}}

function forcePw(){openForm({title:'Wajib Ganti Password',pre:'<p>Anda masuk dengan password sementara. Buat password baru (minimal 8 karakter) untuk melanjutkan.</p>',fields:[{k:'a',l:'Password Sementara',t:'password',r:1},{k:'b',l:'Password Baru',t:'password',r:1},{k:'c',l:'Ulangi Password Baru',t:'password',r:1}],btn:'Simpan & Lanjut',ok:async o=>{if(o.b!==o.c){showToast('Konfirmasi password tidak sama','err');throw 0}await api('changePassword',o.a,o.b);S.user.wc=0;showToast('Password diganti','ok');setTimeout(enter,250)}})}
